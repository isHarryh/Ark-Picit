[project]
name = "ark-picit"
version = "0.1.0"
description = "Arknights Pixel Art Painter"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.11,<6.12",
    "PySide6-Fluent-Widgets>=1.11,<2.0",
    "PySideSix-Frameless-Window>=0.8,<1.0",
    "opencv-python>=4.10,<5.0",
    "numpy>=2.0,<3.0",
]

[dependency-groups]
dev = ["pyinstaller>=6.22,<7.0", "ruff>=0.16,<1.0"]
server = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "sqlmodel>=0.0.22,<1.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client/src"]

[tool.hatch.build.targets.wheel.force-include]
"client/src/resources/i18n" = "src/resources/i18n"
