name: Build

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  PYTHONIOENCODING: "UTF-8"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          pip install uv
          uv --version

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build distributable
        run: uv run python tools/build.py

      # The two artifacts are uploaded separately so that each stays a
      # single file on the artifact page (a combined path would be packed
      # into one zip by the upload action).
      - name: Upload exe artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArkPicit-${{ github.ref_name }}-${{ github.sha }}-win
          path: build/dist/ArkPicit-*.exe

      - name: Upload zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: ArkPicit-${{ github.ref_name }}-${{ github.sha }}-portable
          path: build/dist/ArkPicit-*.zip
